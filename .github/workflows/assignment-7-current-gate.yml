name: Assignment 7 Current-Code Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "artifacts/**"
      - "lib/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - ".github/workflows/assignment-7-current-gate.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10"
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run decision-flow tests
        run: pnpm --filter @workspace/api-server run test

      - name: Typecheck workspace
        run: pnpm run typecheck

      - name: Build decision-flow web app
        env:
          PORT: "23305"
          BASE_PATH: "/"
        run: pnpm --filter @workspace/flyrank-decision-flow run build

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build
